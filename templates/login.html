<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso - Lubrisol</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; background-color: #eef2f5; margin: 0;
            font-family: 'Montserrat', sans-serif;
        }
        .login-card {
            background: #ffffff; padding: 40px 30px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center;
            width: 90%; max-width: 350px;
        }
        .login-card img {
            width: 100%; border-radius: 8px; margin-bottom: 20px;
        }
        .login-card h2 {
            color: #003366; margin-bottom: 25px; font-size: 22px; font-weight: 700;
        }
        .input-group {
            text-align: left; margin-bottom: 15px;
        }
        .input-group label {
            display: block; color: #111; margin-bottom: 5px; font-size: 14px;
        }
        .login-card input {
            width: 100%; padding: 10px; background-color: #fff; border: 1px solid #ccc;
            border-radius: 6px; box-sizing: border-box; font-size: 15px; color: #333;
        }
        .login-card input:focus {
            outline: none; border-color: #006633; box-shadow: 0 0 5px rgba(0,102,51,0.2);
        }
        .login-card button {
            width: 100%; padding: 12px;
            background: linear-gradient(to right, #006633, #003366);
            color: white; border: none; border-radius: 6px; cursor: pointer;
            font-size: 15px; font-weight: bold; margin-top: 10px; transition: 0.3s;
        }
        .login-card button:hover { opacity: 0.9; }
        #error-msg { color: #e74c3c; margin-top: 15px; display: none; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="/static/logointegracion.jpeg" alt="Lubrisol Integración">
        <h2>Acceso al sistema</h2>
        
        <div class="input-group">
            <label>Usuario:</label>
            <input type="text" id="username">
        </div>
        
        <div class="input-group">
            <label>Contraseña:</label>
            <input type="password" id="password" onkeypress="if(event.key === 'Enter') hacerLogin()">
        </div>
        
        <button onclick="hacerLogin()">Ingresar</button>
        <p id="error-msg">❌ Usuario o contraseña incorrectos</p>
    </div>

    <script>
        async function hacerLogin() {
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;
            const errorMsg = document.getElementById("error-msg");
            
            try {
                const res = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const data = await res.json();
                
                if (data.status === "ok") {
                    localStorage.setItem("lubrisol_logged", "yes");
                    window.location.href = "/dashboard";
                } else {
                    errorMsg.style.display = "block";
                }
            } catch (e) {
                errorMsg.textContent = "Error de conexión con el servidor";
                errorMsg.style.display = "block";
            }
        }
    </script>
</body>
</html>
