<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login - Lubrisol</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="login-page"> <!-- 👈 aquí está el cambio -->
  <div class="login-wrapper">
    <div class="login-card">
      <img src="/static/logointegracion.jpeg" alt="Integración Lubrisol" class="login-logo">
      <h2>Acceso al sistema</h2>
      <form id="loginForm">
        <label for="username">Usuario:</label>
        <input type="text" id="username" name="username" required>
        
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required>
        
        <button type="submit" class="btn-exito">Ingresar</button>
      </form>
      <div id="loginMessage" class="login-message"></div>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;

      const response = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: user, password: pass })
      });

      const data = await response.json();
      if (data.status === "ok") {
        window.location.href = "/dashboard";
      } else {
        document.getElementById("loginMessage").textContent = "Credenciales inválidas";
      }
    });
  </script>
</body>
</html>
